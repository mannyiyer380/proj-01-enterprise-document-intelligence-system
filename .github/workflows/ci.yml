name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      PYTHON_DOTENV_DISABLED: '1'
      LANGSMITH_TRACING: 'false'
      LANGSMITH_TRACING_V2: 'false'
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python errors with Flake8
        run: python -m flake8 --select E9,F app data_downloading_script tests

      - name: Run pytest
        run: python -m pytest -q tests
